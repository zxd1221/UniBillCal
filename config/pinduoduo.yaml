# ============================================================
# 拼多多平台配置
#
# 职责：将拼多多原始账单 → 统一格式（字段标准化）
# 不包含：汇总逻辑（见 processor.py）、关联配置表（见 processing.yaml）
# ============================================================
platform: pinduoduo
description: 拼多多平台账单标准化

# ----------------------------------------------------------
# 数据源（Excel 文件）
# ----------------------------------------------------------
source:
  type: excel
  path: data/pinduoduo_bills.xlsx
  sheet: 订单列表
  dtype:
    订单号: str          # 订单号含前导零，强制为字符串

# ----------------------------------------------------------
# 行过滤：只保留已完成订单
# ----------------------------------------------------------
filter:
  conditions:
    - column: 订单状态
      op: in
      value: [已完成, 已收货]
    - column: 实付金额
      op: gt
      value: 0

# ----------------------------------------------------------
# 字段映射：统一字段名 -> 拼多多原始列名
# ----------------------------------------------------------
field_mapping:
  date: 付款时间
  store: 店铺名称
  order_id: 订单号
  remark: 商品名称

# 拼多多金额公式：实付 - 退款 + 平台补贴
amount_formula: "实付金额 - 退款金额 + 平台补贴"

# ----------------------------------------------------------
# 额外保留字段（原始列，透传到统一 DataFrame 供后续使用）
# ----------------------------------------------------------
extra_fields:
  - 平台补贴    # 汇总时可单独统计补贴金额（在 processor.py 中扩展）

# ----------------------------------------------------------
# 标准化结果中间输出（可选）
# ----------------------------------------------------------
# output:
#   type: excel
#   path: output/unified_bills.xlsx
#   sheet: 统一账单
#   mode: append
