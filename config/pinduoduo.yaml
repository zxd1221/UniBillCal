# ============================================================
# 拼多多平台配置
#
# 职责：将拼多多原始账单 → 统一标准格式
# ============================================================
platform: pinduoduo
description: 拼多多平台账单标准化

source:
  type: excel
  path: data/pinduoduo_bills.xlsx
  sheet: 订单列表
  dtype:
    订单号: str       # 订单号含前导零，强制字符串

filter:
  conditions:
    - column: 订单状态
      op: in
      value: [已完成, 已收货]
    - column: 实付金额
      op: gt
      value: 0

field_mapping:
  business_date: 付款时间
  store_name:    店铺名称
  order_no:      订单号

# 实付 - 退款 + 平台补贴
amount_formula: "实付金额 - 退款金额 + 平台补贴"

# 保留平台补贴字段供 Processor 单独汇总（若需要）
extra_fields:
  - 平台补贴

