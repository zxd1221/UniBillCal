# ============================================================
# 支付宝平台配置
#
# 职责：将支付宝原始账单 → 统一格式（字段标准化）
# 不包含：汇总逻辑（见 processor.py）、关联配置表（见 processing.yaml）
# ============================================================
platform: alipay
description: 支付宝平台账单标准化

# ----------------------------------------------------------
# 数据源
# ----------------------------------------------------------
source:
  type: excel
  path: data/alipay_bills.xlsx
  sheet: Sheet1
  skiprows: 4          # 支付宝导出文件前4行是说明文字

# ----------------------------------------------------------
# 行过滤：只保留有效交易（使用原始列名）
# ----------------------------------------------------------
filter:
  conditions:
    - column: 交易状态
      op: eq
      value: 交易成功
    - column: 交易分类
      op: not_in
      value: [退款, 信用还款]

# ----------------------------------------------------------
# 字段映射：统一字段名 -> 支付宝原始列名
# ----------------------------------------------------------
field_mapping:
  date: 交易时间
  store: 商家名称
  order_id: 商户订单号
  remark: 备注

# 金额公式（使用原始列名进行算术运算）
amount_formula: "支付金额 - 退款金额"

# ----------------------------------------------------------
# 标准化结果中间输出（可选）
# 注释掉则只在内存中处理，不落地文件
# 多平台可写到同一文件（mode: append），也可各自独立
# ----------------------------------------------------------
# output:
#   type: excel
#   path: output/unified_bills.xlsx
#   sheet: 统一账单
#   mode: append
