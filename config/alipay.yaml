# ============================================================
# 支付宝账单处理配置
# ============================================================
platform: alipay
description: 支付宝平台账单标准化处理

# ----------------------------------------------------------
# 数据源（Excel 文件）
# ----------------------------------------------------------
source:
  type: excel
  path: data/alipay_bills.xlsx
  sheet: Sheet1
  skiprows: 4          # 支付宝导出文件前4行是说明文字

# ----------------------------------------------------------
# 行过滤：只保留交易成功的记录
# ----------------------------------------------------------
filter:
  conditions:
    - column: 交易状态
      op: eq
      value: 交易成功
    - column: 交易分类
      op: not_in
      value: [退款, 信用还款]

# ----------------------------------------------------------
# 字段映射：标准字段 -> 源字段（Excel 列名）
# ----------------------------------------------------------
field_mapping:
  date: 交易时间
  store: 商家名称
  order_id: 商户订单号
  remark: 备注

# 金额公式（支付金额 - 退款金额）
amount_formula: "支付金额 - 退款金额"

# ----------------------------------------------------------
# 关联配置表
# ----------------------------------------------------------
references:
  - name: category_mapping
    source:
      type: excel
      path: config/category_map.xlsx
      sheet: 支付宝
    join_on:
      left: store          # 主表字段
      right: 商家名称      # 配置表字段
    fields:
      category: 类目名称   # 目标字段: 配置表列名
      subject: 科目代码

# ----------------------------------------------------------
# 汇总规则
# ----------------------------------------------------------
aggregation:
  strategy: standard
  group_by: [date, store, category, subject, platform]
  sum_fields: [amount]
  count_field: order_count

# ----------------------------------------------------------
# 输出配置
# ----------------------------------------------------------
output:
  format: excel
  path: output/alipay_unified.xlsx
  sheet: 支付宝统一账单
  columns:
    - date
    - store
    - category
    - subject
    - amount
    - order_count
    - platform
