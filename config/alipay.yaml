# ============================================================
# 支付宝平台配置
#
# 职责：将支付宝原始账单 → 统一标准格式
# 不包含：汇总逻辑（processor.py）、关联配置表（processing.yaml）
# ============================================================
platform: alipay
description: 支付宝平台账单标准化

# ----------------------------------------------------------
# 数据源
# ----------------------------------------------------------
source:
  type: excel
  path: data/alipay_bills.xlsx
  sheet: Sheet1
  skiprows: 4       # 支付宝导出文件前4行是说明文字

# ----------------------------------------------------------
# 行过滤：使用原始列名过滤（在字段映射前执行）
# ----------------------------------------------------------
filter:
  conditions:
    - column: 交易状态
      op: eq
      value: 交易成功
    - column: 交易分类
      op: not_in
      value: [退款, 信用还款]

# ----------------------------------------------------------
# 字段映射：统一字段名 -> 支付宝原始列名
# 统一字段名必须使用标准名称（见 models/unified.py UNIFIED_FIELDS）
# ----------------------------------------------------------
field_mapping:
  business_date: 交易时间     # 必填
  store_name:    商家名称
  order_no:      商户订单号

# 金额公式（使用原始列名）
amount_formula: "支付金额 - 退款金额"

# ----------------------------------------------------------
# 标准化结果中间输出（可选）
# 多平台可写同一文件（mode: append）；也可不配置，纯内存处理
# ----------------------------------------------------------
# output:
#   type: excel
#   path: output/unified_bills.xlsx
#   sheet: 统一账单
#   mode: append
