# ============================================================
# 统一处理配置 - 所有平台共用
#
# 包含：
#   1. 公共配置表（类目/科目映射）的数据源 和 关联方式
#   2. 最终输出位置
#
# 不包含：汇总计算规则（GROUP BY / SUM 等在 processor.py 代码中）
# ============================================================

# ----------------------------------------------------------
# 公共配置表关联（在所有平台标准化、合并后执行）
# join_on.left 使用统一字段名（非原始列名）
# ----------------------------------------------------------
references:
  - name: category_mapping
    source:
      type: excel
      path: config/category_map.xlsx
      sheet: 通用
    join_on:
      left: store_name          # 统一格式字段名
      right: 商家名称            # 配置表中的字段名
    fields:
      category: 类目名称         # 目标字段名: 配置表列名
      subject:  科目代码

  # 二级映射示例（按需启用）
  # - name: subject_detail
  #   source:
  #     type: sqlserver
  #     connection_string: "mssql+pyodbc://..."
  #     table: SubjectDetail
  #   join_on:
  #     left: subject
  #     right: subject_code
  #   fields:
  #     subject_name: subject_name_cn

# ----------------------------------------------------------
# 最终输出（汇总后的统一标准数据）
# ----------------------------------------------------------
output:
  type: excel
  path: output/result.xlsx
  sheet: 统一账单汇总
  mode: overwrite

  # SQL Server 输出示例：
  # type: sqlserver
  # connection_string: "mssql+pyodbc://sa:password@localhost/BillDB?driver=ODBC+Driver+17+for+SQL+Server"
  # table: unified_bill_result
  # mode: append
