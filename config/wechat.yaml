# ============================================================
# 微信支付平台配置
#
# 职责：将微信支付原始账单 → 统一格式（字段标准化）
# 数据源：SQL Server 数据库表
# 不包含：汇总逻辑（见 processor.py）、关联配置表（见 processing.yaml）
# ============================================================
platform: wechat
description: 微信支付平台账单标准化

# ----------------------------------------------------------
# 数据源（SQL Server）
# ----------------------------------------------------------
source:
  type: sqlserver
  connection_string: "mssql+pyodbc://sa:password@localhost/BillDB?driver=ODBC+Driver+17+for+SQL+Server"
  # 直接指定表名（读取全表），或写自定义 SQL（支持日期过滤等）
  query: >
    SELECT *
    FROM [dbo].[wechat_bill]
    WHERE 交易状态 IN ('支付成功', '已退款')

# ----------------------------------------------------------
# 行过滤（在 query 结果基础上二次过滤）
# ----------------------------------------------------------
filter:
  column: 收支
  op: eq
  value: 收入

# ----------------------------------------------------------
# 字段映射：统一字段名 -> 微信原始列名
# ----------------------------------------------------------
field_mapping:
  date: 交易时间
  store: 商品名称
  order_id: 微信单号
  remark: 当前状态

# 金额公式（微信列名含括号，引擎自动处理）
amount_formula: "金额(元) - 退款金额(元)"

# ----------------------------------------------------------
# 标准化结果中间输出（可选）
# ----------------------------------------------------------
# output:
#   type: sqlserver
#   connection_string: "mssql+pyodbc://sa:password@localhost/BillDB?driver=ODBC+Driver+17+for+SQL+Server"
#   table: unified_bills
#   mode: append
